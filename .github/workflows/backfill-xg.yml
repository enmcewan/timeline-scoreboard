name: Backfill EPL match stats

permissions:
  contents: read

on:
  schedule:
    # Recheck TheStatsAPI after weekend match windows for finalized match statistics.
    - cron: "45 22 * * 0,1"
    - cron: "45 6 * * 1,2"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if no match statistics changed"
        required: false
        default: false
        type: boolean

jobs:
  backfill-stats:
    runs-on: ubuntu-latest
    env:
      TIMELINE_SEASON: 2026-27
      SEASON_DATA_DIR: public/data/leagues/epl/2026-27
      LIVE_SEASON_DATA_URL: https://timelinefootball.com/data/leagues/epl/2026-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Hydrate live season data
        run: |
          mkdir -p "$SEASON_DATA_DIR/matchweeks"

          for file in fixtures.raw.json events.raw.json standings.json; do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/$file" -o "$SEASON_DATA_DIR/$file"; then
              echo "Hydrated $file from live site."
            else
              echo "Live $file unavailable; keeping repository copy."
            fi
          done

          for round in $(seq 1 38); do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/matchweeks/$round.json" -o "$SEASON_DATA_DIR/matchweeks/$round.json"; then
              echo "Hydrated matchweek $round."
            else
              echo "Live matchweek $round unavailable; keeping repository copy."
            fi
          done

          mkdir -p "$SEASON_DATA_DIR/player-stats/matches"
          player_stats_temp="$SEASON_DATA_DIR/player-stats.json.tmp"
          if curl -fsSL "$LIVE_SEASON_DATA_URL/player-stats.json" -o "$player_stats_temp"; then
            mv "$player_stats_temp" "$SEASON_DATA_DIR/player-stats.json"
            echo "Hydrated player-stats.json."
          else
            rm -f "$player_stats_temp"
            echo "Live player-stats.json unavailable; keeping repository copy."
          fi

          node -e "const f=require('./$SEASON_DATA_DIR/fixtures.raw.json'); for(const x of f.response||[]) if(['FT','AET','PEN'].includes(x.fixture?.status?.short)) console.log(x.fixture.id)" |
            while read fixture_id; do
              cache_file="$SEASON_DATA_DIR/player-stats/matches/$fixture_id.json"
              temp_file="$cache_file.tmp"
              if curl -fsSL "$LIVE_SEASON_DATA_URL/player-stats/matches/$fixture_id.json" -o "$temp_file"; then
                mv "$temp_file" "$cache_file"
                echo "Hydrated player stats for fixture $fixture_id."
              else
                rm -f "$temp_file"
                echo "Live player stats unavailable for fixture $fixture_id; keeping repository cache."
              fi
            done

      - name: Merge deployed odds archive
        run: npm run sync:odds

      - name: Capture matchweek baseline
        run: |
          mkdir -p .tmp
          cp -R "$SEASON_DATA_DIR/matchweeks" .tmp/matchweeks-before
          cp "$SEASON_DATA_DIR/player-stats.json" .tmp/player-stats-before.json 2>/dev/null || true

      - name: Backfill finalized TheStatsAPI data
        env:
          TSAPI_KEY: ${{ secrets.TSAPI_KEY }}
        run: npm run backfill:stats

      - name: Refresh player statistics
        env:
          TSAPI_KEY: ${{ secrets.TSAPI_KEY }}
        run: npm run refresh:player-stats

      - name: Check for match-stat changes
        id: changes
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Reason: force_deploy set"
            exit 0
          fi

          MATCHWEEKS_CHANGED=0
          PLAYER_STATS_CHANGED=0
          diff -qr .tmp/matchweeks-before "$SEASON_DATA_DIR/matchweeks" >/dev/null || MATCHWEEKS_CHANGED=1
          if [ -f .tmp/player-stats-before.json ] && [ -f "$SEASON_DATA_DIR/player-stats.json" ]; then
            cmp -s .tmp/player-stats-before.json "$SEASON_DATA_DIR/player-stats.json" || PLAYER_STATS_CHANGED=1
          elif [ -f "$SEASON_DATA_DIR/player-stats.json" ]; then
            PLAYER_STATS_CHANGED=1
          fi

          if [ "$MATCHWEEKS_CHANGED" = "0" ] && [ "$PLAYER_STATS_CHANGED" = "0" ]; then
            echo "should_deploy=0" >> "$GITHUB_OUTPUT"
            echo "No match or player-stat changes; skipping build/deploy."
          else
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Match or player statistics changed; building and deploying."
          fi

      - name: Build players cache
        if: steps.changes.outputs.should_deploy == '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node src/scripts/build-players-cache.mjs

      - name: Build season context
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:season-context

      - name: Build
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:prerender

      - name: Verify prerender output exists
        if: steps.changes.outputs.should_deploy == '1'
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/epl/2026-27/matchweek/1/index.html
          test -f dist/epl/2026-27/table/index.html
          test -f dist/epl/2026-27/players/index.html

      - name: Deploy to Netlify (prod)
        if: steps.changes.outputs.should_deploy == '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes --package netlify-cli@27.0.1 netlify deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --no-build
