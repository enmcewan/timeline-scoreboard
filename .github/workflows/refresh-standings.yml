name: Refresh EPL Standings

concurrency:
  group: timeline-football-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

on:
  schedule:
    # Standings and final match data can lag the final whistle.
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
    - cron: "30 20 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if standings and match data match the live site"
        required: false
        default: false
        type: boolean

jobs:
  refresh-standings:
    runs-on: ubuntu-latest
    env:
      TIMELINE_SEASON: 2026-27
      STANDINGS_PATH: public/data/leagues/epl/2026-27/standings.json
      SEASON_DATA_DIR: public/data/leagues/epl/2026-27
      LIVE_SEASON_DATA_URL: https://timelinefootball.com/data/leagues/epl/2026-27
      LIVE_STANDINGS_URL: https://timelinefootball.com/data/leagues/epl/2026-27/standings.json
      LAURIS_CURRENT_URL: https://lauris-webdev.com/timeline-data/epl/2026-27/matchweeks/current.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Capture live standings
        run: |
          mkdir -p .tmp
          if curl -fsSL "$LIVE_STANDINGS_URL" -o .tmp/live-standings.json; then
            echo "Live standings downloaded."
          else
            echo "Live standings unavailable; will deploy after fetch."
          fi

      - name: Capture Lauris current matchweek
        run: |
          if curl -fsSL "$LAURIS_CURRENT_URL" -o .tmp/lauris-current.json; then
            round=$(jq -r '.round // empty' .tmp/lauris-current.json)
            season_path=$(jq -r '.seasonPath // empty' .tmp/lauris-current.json)
            matches_type=$(jq -r '.matches | type' .tmp/lauris-current.json)
            published_at=$(jq -r '.publishedAt // empty' .tmp/lauris-current.json)
            published_epoch=$(date -d "$published_at" +%s 2>/dev/null || echo 0)
            age_seconds=$(($(date +%s) - published_epoch))

            if [[ "$round" =~ ^([1-9]|[12][0-9]|3[0-8])$ ]] && \
               [ "$season_path" = "$TIMELINE_SEASON" ] && \
               [ "$matches_type" = "array" ] && \
               [ "$published_epoch" -gt 0 ] && \
               [ "$age_seconds" -ge 0 ] && \
               [ "$age_seconds" -le 3600 ]; then
              echo "Lauris matchweek $round downloaded."
            else
              echo "Lauris current matchweek was invalid or stale; ignoring it."
              rm -f .tmp/lauris-current.json
            fi
          else
            echo "Lauris current matchweek unavailable; standings can still trigger a deploy."
          fi

      - name: Hydrate live match data
        run: |
          mkdir -p "$SEASON_DATA_DIR/matchweeks"

          for file in fixtures.raw.json events.raw.json; do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/$file" -o "$SEASON_DATA_DIR/$file"; then
              echo "Hydrated $file from live site."
            else
              echo "Live $file unavailable; keeping repository copy."
            fi
          done

          for round in $(seq 1 38); do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/matchweeks/$round.json" -o "$SEASON_DATA_DIR/matchweeks/$round.json"; then
              echo "Hydrated matchweek $round."
            else
              echo "Live matchweek $round unavailable; keeping repository copy."
            fi
          done

      - name: Merge deployed odds archive
        run: npm run sync:odds

      - name: Sync deployed player statistics
        run: npm run sync:player-stats

      - name: Fetch standings
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: npm run refresh:epl:table

      - name: Check for standings or matchweek changes
        id: changes
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Reason: force_deploy set"
            exit 0
          fi

          standings_changed=0
          matchweek_changed=0

          if [ ! -f .tmp/live-standings.json ]; then
            echo "Reason: no live standings baseline"
            standings_changed=1
          elif cmp -s .tmp/live-standings.json "$STANDINGS_PATH"; then
            echo "Standings unchanged."
          else
            echo "Standings changed."
            standings_changed=1
          fi

          if [ -f .tmp/lauris-current.json ]; then
            round=$(jq -r '.round' .tmp/lauris-current.json)
            deployed_matchweek="$SEASON_DATA_DIR/matchweeks/$round.json"

            if [ ! -f "$deployed_matchweek" ]; then
              echo "Current matchweek $round is missing from the deployed data."
              matchweek_changed=1
            else
              jq -S -c '.matches // []' .tmp/lauris-current.json > .tmp/lauris-matches.json
              jq -S -c '.matches // []' "$deployed_matchweek" > .tmp/deployed-matches.json

              if cmp -s .tmp/lauris-matches.json .tmp/deployed-matches.json; then
                echo "Current matchweek $round unchanged."
              else
                echo "Current matchweek $round changed."
                matchweek_changed=1
              fi
            fi
          fi

          if [ "$standings_changed" = "1" ] || [ "$matchweek_changed" = "1" ]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Building and deploying refreshed standings and match data."
          else
            echo "should_deploy=0" >> "$GITHUB_OUTPUT"
            echo "Standings and current matchweek unchanged; skipping build/deploy."
          fi

      - name: Refresh fixtures, events, and matchdays
        if: steps.changes.outputs.should_deploy == '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          npm run fetch:fixtures
          npm run fetch:events
          npm run fetch:odds
          npm run refresh:epl

      - name: Overlay Lauris current matchweek
        if: steps.changes.outputs.should_deploy == '1'
        run: |
          if [ -f .tmp/lauris-current.json ]; then
            round=$(jq -r '.round' .tmp/lauris-current.json)
            cp .tmp/lauris-current.json "$SEASON_DATA_DIR/matchweeks/$round.json"
            echo "Applied Lauris matchweek $round to the static build."
          else
            echo "No Lauris matchweek available; using refreshed API-Football data."
          fi

      - name: Build players cache
        if: steps.changes.outputs.should_deploy == '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node src/scripts/build-players-cache.mjs

      - name: Build season context
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:season-context

      - name: Build
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:prerender

      - name: Verify prerender output exists
        if: steps.changes.outputs.should_deploy == '1'
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/epl/2025-26/matchweek/38/index.html
          test -f dist/epl/2026-27/table/index.html
          test -f dist/epl/2026-27/matchweek/1/index.html
          test -f dist/epl/2026-27/players/index.html

      - name: Deploy to Netlify (prod)
        if: steps.changes.outputs.should_deploy == '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes --package netlify-cli@27.0.1 netlify deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --no-build

      - name: Submit IndexNow for standings pages
        if: steps.changes.outputs.should_deploy == '1'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          cat > indexnow-standings.json << EOF
          {
            "host": "timelinefootball.com",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://timelinefootball.com/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://timelinefootball.com/epl/2026-27/table/",
              "https://timelinefootball.com/epl/2026-27/"
            ]
          }
          EOF

          cat indexnow-standings.json

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d @indexnow-standings.json \
            https://api.indexnow.org/indexnow)

          echo "IndexNow HTTP status: $code"
          test "$code" = "200" -o "$code" = "202"
