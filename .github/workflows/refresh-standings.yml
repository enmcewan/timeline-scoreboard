name: Refresh EPL Standings

concurrency:
  group: timeline-football-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

on:
  schedule:
    # Hourly through the broad EPL match-day window, plus an overnight fallback.
    - cron: "17 0-4,12-23 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if refreshed data matches the live site"
        required: false
        default: false
        type: boolean

jobs:
  refresh-standings:
    runs-on: ubuntu-latest
    env:
      TIMELINE_SEASON: 2026-27
      SEASON_DATA_DIR: public/data/leagues/epl/2026-27
      LIVE_SEASON_DATA_URL: https://timelinefootball.com/data/leagues/epl/2026-27
      LAURIS_CURRENT_URL: https://lauris-webdev.com/timeline-data/epl/2026-27/matchweeks/current.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Capture Lauris current matchweek
        run: |
          mkdir -p .tmp
          if curl -fsSL "$LAURIS_CURRENT_URL" -o .tmp/lauris-current.json; then
            round=$(jq -r '.round // empty' .tmp/lauris-current.json)
            season_path=$(jq -r '.seasonPath // empty' .tmp/lauris-current.json)
            matches_type=$(jq -r '.matches | type' .tmp/lauris-current.json)
            published_at=$(jq -r '.publishedAt // empty' .tmp/lauris-current.json)
            published_epoch=$(date -d "$published_at" +%s 2>/dev/null || echo 0)
            age_seconds=$(($(date +%s) - published_epoch))

            if [[ "$round" =~ ^([1-9]|[12][0-9]|3[0-8])$ ]] && \
               [ "$season_path" = "$TIMELINE_SEASON" ] && \
               [ "$matches_type" = "array" ] && \
               [ "$published_epoch" -gt 0 ] && \
               [ "$age_seconds" -ge 0 ] && \
               [ "$age_seconds" -le 3600 ]; then
              echo "Lauris matchweek $round downloaded."
            else
              echo "Lauris current matchweek was invalid or stale; ignoring it."
              rm -f .tmp/lauris-current.json
            fi
          else
            echo "Lauris current matchweek unavailable; API-Football can still refresh the site."
          fi

      - name: Hydrate deployed fixture schedule
        run: |
          mkdir -p "$SEASON_DATA_DIR/matchweeks"
          if curl -fsSL "$LIVE_SEASON_DATA_URL/fixtures.raw.json" -o "$SEASON_DATA_DIR/fixtures.raw.json"; then
            echo "Hydrated fixture schedule from live site."
          else
            echo "Live fixture schedule unavailable; using repository copy for the gate."
          fi

      - name: Check active post-match window
        id: gate
        env:
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          FALLBACK_RUN: ${{ github.event.schedule == '30 6 * * *' }}
        run: |
          if [ "$MANUAL_RUN" = "true" ]; then
            echo "should_process=1" >> "$GITHUB_OUTPUT"
            echo "Reason: manual workflow run"
            exit 0
          fi

          if [ "$FALLBACK_RUN" = "true" ]; then
            echo "should_process=1" >> "$GITHUB_OUTPUT"
            echo "Reason: daily overnight fallback"
            exit 0
          fi

          gate=$(node src/scripts/should-refresh.mjs \
            --fixtures "$SEASON_DATA_DIR/fixtures.raw.json" \
            --post-hours 8)
          echo "$gate"
          if grep -q "REFRESH=1" <<< "$gate"; then
            echo "should_process=1" >> "$GITHUB_OUTPUT"
            echo "Reason: a fixture is live or inside the post-match retry window"
            exit 0
          fi

          echo "should_process=0" >> "$GITHUB_OUTPUT"
          echo "No live or recently completed fixture; no football APIs will be called."

      - name: Install
        if: steps.gate.outputs.should_process == '1'
        run: npm ci

      - name: Hydrate deployed season data
        if: steps.gate.outputs.should_process == '1'
        run: |
          for file in events.raw.json standings.json; do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/$file" -o "$SEASON_DATA_DIR/$file"; then
              echo "Hydrated $file from live site."
            else
              echo "Live $file unavailable; keeping repository copy."
            fi
          done

          for round in $(seq 1 38); do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/matchweeks/$round.json" -o "$SEASON_DATA_DIR/matchweeks/$round.json"; then
              echo "Hydrated matchweek $round."
            else
              echo "Live matchweek $round unavailable; keeping repository copy."
            fi
          done

          profile_cache="$SEASON_DATA_DIR/player-profiles.json"
          if curl -fsSL "$LIVE_SEASON_DATA_URL/player-profiles.json" -o "$profile_cache.tmp"; then
            mv "$profile_cache.tmp" "$profile_cache"
            echo "Hydrated player profile cache."
          else
            rm -f "$profile_cache.tmp"
            echo "Live player profile cache unavailable; keeping repository copy."
          fi

      - name: Hydrate deployed odds and player statistics
        if: steps.gate.outputs.should_process == '1'
        run: |
          npm run sync:odds
          npm run sync:player-stats

      - name: Capture deployed data baseline
        if: steps.gate.outputs.should_process == '1'
        run: |
          mkdir -p .tmp/baseline
          cp -R "$SEASON_DATA_DIR/matchweeks" .tmp/baseline/matchweeks
          for file in standings.json fixtures.raw.json events.raw.json odds.json player-stats.json; do
            if [ -f "$SEASON_DATA_DIR/$file" ]; then
              cp "$SEASON_DATA_DIR/$file" ".tmp/baseline/$file"
            fi
          done

      - name: Refresh standings, fixtures, events, and matchdays
        if: steps.gate.outputs.should_process == '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          npm run refresh:epl:table
          npm run fetch:fixtures
          npm run fetch:events
          npm run fetch:odds
          npm run refresh:epl

      - name: Overlay Lauris current matchweek
        if: steps.gate.outputs.should_process == '1'
        run: |
          if [ -f .tmp/lauris-current.json ]; then
            round=$(jq -r '.round' .tmp/lauris-current.json)
            cp .tmp/lauris-current.json "$SEASON_DATA_DIR/matchweeks/$round.json"
            echo "Applied Lauris matchweek $round to the static build."
          else
            echo "No Lauris matchweek available; using refreshed API-Football data."
          fi

      - name: Restore existing TSAPI enrichment
        if: steps.gate.outputs.should_process == '1'
        run: node src/scripts/restore-match-enrichment.mjs .tmp/baseline/matchweeks "$SEASON_DATA_DIR/matchweeks"

      - name: Refresh recent match insights and shot maps
        if: steps.gate.outputs.should_process == '1'
        continue-on-error: true
        env:
          TSAPI_KEY: ${{ secrets.TSAPI_KEY }}
        run: npm run backfill:recent-stats

      - name: Pause between TSAPI request groups
        if: steps.gate.outputs.should_process == '1'
        run: sleep 65

      - name: Refresh recent player statistics
        if: steps.gate.outputs.should_process == '1'
        continue-on-error: true
        env:
          TSAPI_KEY: ${{ secrets.TSAPI_KEY }}
        run: npm run refresh:recent-player-stats

      - name: Check refreshed data for changes
        id: changes
        if: steps.gate.outputs.should_process == '1'
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Reason: force_deploy set"
            exit 0
          fi

          changed=0
          if ! diff -qr .tmp/baseline/matchweeks "$SEASON_DATA_DIR/matchweeks"; then
            echo "Matchweek data changed."
            changed=1
          fi

          for file in standings.json fixtures.raw.json events.raw.json odds.json player-stats.json; do
            baseline=".tmp/baseline/$file"
            current="$SEASON_DATA_DIR/$file"
            if [ ! -f "$baseline" ] || [ ! -f "$current" ] || ! cmp -s "$baseline" "$current"; then
              echo "$file changed."
              changed=1
            fi
          done

          echo "should_deploy=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "1" ]; then
            echo "Refreshed football data changed; building and deploying."
          else
            echo "All refreshed data matches the deployed site; skipping build/deploy."
          fi

      - name: Build players cache
        if: steps.changes.outputs.should_deploy == '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node src/scripts/build-players-cache.mjs

      - name: Build season context
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:season-context

      - name: Build
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:prerender

      - name: Verify prerender output exists
        if: steps.changes.outputs.should_deploy == '1'
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/epl/2025-26/matchweek/38/index.html
          test -f dist/epl/2026-27/table/index.html
          test -f dist/epl/2026-27/matchweek/1/index.html
          test -f dist/epl/2026-27/players/index.html

      - name: Deploy to Netlify (prod)
        if: steps.changes.outputs.should_deploy == '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes --package netlify-cli@27.0.1 netlify deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --no-build

      - name: Submit IndexNow for current EPL pages
        if: steps.changes.outputs.should_deploy == '1'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          cat > indexnow-standings.json << EOF
          {
            "host": "timelinefootball.com",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://timelinefootball.com/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://timelinefootball.com/epl/2026-27/table/",
              "https://timelinefootball.com/epl/2026-27/",
              "https://timelinefootball.com/epl/2026-27/players/"
            ]
          }
          EOF

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d @indexnow-standings.json \
            https://api.indexnow.org/indexnow)

          echo "IndexNow HTTP status: $code"
          test "$code" = "200" -o "$code" = "202"
