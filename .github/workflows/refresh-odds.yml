name: Refresh EPL Odds

permissions:
  contents: read

on:
  schedule:
    # Pre-match odds can move on matchday, so refresh a few broad windows daily.
    - cron: "15 1 * * *"
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if odds match the live site"
        required: false
        default: false
        type: boolean

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    env:
      TIMELINE_SEASON: 2026-27
      ODDS_LOOKAHEAD_DAYS: 11
      ODDS_PATH: public/data/leagues/epl/2026-27/odds.json
      SEASON_DATA_DIR: public/data/leagues/epl/2026-27
      LIVE_SEASON_DATA_URL: https://timelinefootball.com/data/leagues/epl/2026-27
      LIVE_ODDS_URL: https://timelinefootball.com/data/leagues/epl/2026-27/odds.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Capture live odds
        run: |
          mkdir -p .tmp
          if curl -fsSL "$LIVE_ODDS_URL" -o .tmp/live-odds.json; then
            echo "Live odds downloaded."
          else
            echo "Live odds unavailable; will deploy after fetch if odds are available."
          fi

      - name: Hydrate live season data
        run: |
          mkdir -p "$SEASON_DATA_DIR/matchweeks"

          for file in fixtures.raw.json events.raw.json standings.json odds.json; do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/$file" -o "$SEASON_DATA_DIR/$file"; then
              echo "Hydrated $file from live site."
            else
              echo "Live $file unavailable; keeping repository copy."
            fi
          done

          for round in $(seq 1 38); do
            if curl -fsSL "$LIVE_SEASON_DATA_URL/matchweeks/$round.json" -o "$SEASON_DATA_DIR/matchweeks/$round.json"; then
              echo "Hydrated matchweek $round."
            else
              echo "Live matchweek $round unavailable; keeping repository copy."
            fi
          done

      - name: Fetch fixtures
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: npm run fetch:fixtures

      - name: Fetch odds
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: npm run fetch:odds

      - name: Check for odds changes
        id: changes
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Reason: force_deploy set"
            exit 0
          fi

          if [ ! -f "$ODDS_PATH" ]; then
            echo "should_deploy=0" >> "$GITHUB_OUTPUT"
            echo "No odds file produced; skipping build/deploy."
            exit 0
          fi

          if [ ! -f .tmp/live-odds.json ]; then
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Reason: no live odds baseline"
            exit 0
          fi

          if cmp -s .tmp/live-odds.json "$ODDS_PATH"; then
            echo "should_deploy=0" >> "$GITHUB_OUTPUT"
            echo "Odds unchanged; skipping build/deploy."
          else
            echo "should_deploy=1" >> "$GITHUB_OUTPUT"
            echo "Odds changed; building and deploying."
          fi

      - name: Build season context
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:season-context

      - name: Build
        if: steps.changes.outputs.should_deploy == '1'
        run: npm run build:prerender

      - name: Verify prerender output exists
        if: steps.changes.outputs.should_deploy == '1'
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/data/leagues/epl/2026-27/odds.json
          test -f dist/epl/2026-27/matchweek/1/index.html

      - name: Deploy to Netlify (prod)
        if: steps.changes.outputs.should_deploy == '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes --package netlify-cli@27.0.1 netlify deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --no-build

      - name: Determine current round
        if: steps.changes.outputs.should_deploy == '1'
        id: current_round
        run: |
          out=$(node src/scripts/get-current-round.mjs)
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

      - name: Submit IndexNow for current odds display
        if: steps.changes.outputs.should_deploy == '1'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          ROUND: ${{ steps.current_round.outputs.round }}
        run: |
          cat > indexnow-odds.json << EOF
          {
            "host": "timelinefootball.com",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://timelinefootball.com/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://timelinefootball.com/epl/2026-27/",
              "https://timelinefootball.com/epl/2026-27/matchweek/${ROUND}/"
            ]
          }
          EOF

          cat indexnow-odds.json

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d @indexnow-odds.json \
            https://api.indexnow.org/indexnow)

          echo "IndexNow HTTP status: $code"
          test "$code" = "200" -o "$code" = "202"
