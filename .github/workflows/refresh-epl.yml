name: Sync EPL Static Site

permissions:
  contents: read

on:
  schedule:
    # Lauris handles live match updates. Rebuild static/SEO pages once overnight.
    - cron: "21 4 * * *"
  workflow_dispatch:

jobs:
  sync-static-site:
    runs-on: ubuntu-latest
    env:
      TIMELINE_SEASON: 2026-27
      SEASON_DATA_DIR: public/data/leagues/epl/2026-27
      LIVE_SITE_DATA_URL: https://timelinefootball.com/data/leagues/epl/2026-27
      LAURIS_DATA_URL: https://lauris-webdev.com/timeline-data/epl/2026-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Hydrate deployed season data
        run: |
          mkdir -p "$SEASON_DATA_DIR/matchweeks"

          for file in fixtures.raw.json events.raw.json standings.json odds.json; do
            if curl -fsSL "$LIVE_SITE_DATA_URL/$file" -o "$SEASON_DATA_DIR/$file"; then
              echo "Hydrated deployed $file."
            else
              echo "Deployed $file unavailable; keeping repository copy."
            fi
          done

          for round in $(seq 1 38); do
            if curl -fsSL "$LIVE_SITE_DATA_URL/matchweeks/$round.json" -o "$SEASON_DATA_DIR/matchweeks/$round.json"; then
              echo "Hydrated deployed matchweek $round."
            else
              echo "Deployed matchweek $round unavailable; keeping repository copy."
            fi
          done

      - name: Overlay Lauris live match data
        run: |
          mkdir -p .tmp

          for file in fixtures.raw.json events.raw.json; do
            temp_file=".tmp/lauris-$file"
            if curl -fsSL "$LAURIS_DATA_URL/$file" -o "$temp_file" && \
              node -e 'const fs=require("node:fs"); try { const d=JSON.parse(fs.readFileSync(process.argv[1], "utf8").replace(/^\uFEFF/, "")); if (!Array.isArray(d.response)) process.exit(1); } catch (err) { console.error(err.message); process.exit(1); }' "$temp_file"; then
              cp "$temp_file" "$SEASON_DATA_DIR/$file"
              echo "Overlaid validated Lauris $file."
            else
              echo "Lauris $file unavailable or invalid; keeping deployed copy."
            fi
          done

          if curl -fsSL "$LAURIS_DATA_URL/matchweeks/current.json" -o .tmp/lauris-current.json && \
            round=$(node -e 'const fs=require("node:fs"); try { const d=JSON.parse(fs.readFileSync(process.argv[1], "utf8").replace(/^\uFEFF/, "")); const round=Number(d.round); if (!Number.isInteger(round) || round < 1 || round > 38 || !Array.isArray(d.matches) || d.matches.length === 0) process.exit(1); process.stdout.write(String(round)); } catch (err) { console.error(err.message); process.exit(1); }' .tmp/lauris-current.json); then
            cp .tmp/lauris-current.json "$SEASON_DATA_DIR/matchweeks/$round.json"
            echo "Overlaid validated Lauris current matchweek $round."
          else
            echo "Lauris current matchweek unavailable or invalid; using deployed matchweeks."
          fi

      - name: Cache new player profiles
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node src/scripts/build-players-cache.mjs

      - name: Build season context
        run: npm run build:season-context

      - name: Build
        run: npm run build:prerender

      - name: Verify prerender output exists
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/epl/2025-26/matchweek/38/index.html
          test -f dist/epl/2026-27/matchweek/1/index.html
          test -f dist/epl/2026-27/table/index.html

      - name: Deploy to Netlify (prod)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes --package netlify-cli@27.0.1 netlify deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --no-build

      - name: Determine current round
        id: current_round
        run: |
          out=$(node src/scripts/get-current-round.mjs)
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

      - name: Submit IndexNow (current + previous matchweek)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          ROUND: ${{ steps.current_round.outputs.round }}
        run: |
          urls="\"https://timelinefootball.com/epl/2026-27/matchweek/${ROUND}/\""

          if [ "${ROUND}" -gt 1 ]; then
            prev=$((ROUND-1))
            urls="${urls}, \"https://timelinefootball.com/epl/2026-27/matchweek/${prev}/\""
          fi

          cat > indexnow.json << EOF
          {
            "host": "timelinefootball.com",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://timelinefootball.com/${INDEXNOW_KEY}.txt",
            "urlList": [ ${urls} ]
          }
          EOF

          echo "Submitting IndexNow payload:"
          cat indexnow.json

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d @indexnow.json \
            https://api.indexnow.org/indexnow)

          echo "IndexNow HTTP status: $code"
          test "$code" = "200" -o "$code" = "202"
